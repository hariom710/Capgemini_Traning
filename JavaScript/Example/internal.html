<!DOCTYPE html>
<html>
<head>
  <title>Internal JS Form</title>
  <style>
    body{font-family:Arial;background:#f4f6f8;display:flex;justify-content:center;margin-top:60px}
    .box{background:#fff;padding:25px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.1);width:300px}
    input,button{width:100%;padding:8px;margin:8px 0}
    .error{color:red;font-size:13px}
  </style>
</head>
<body>

<div class="box">
  <h3>Internal JS Form</h3>

  <input id="name" placeholder="Name">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="validateForm()">Submit</button>
  <div id="msg" class="error"></div>
</div>

<script>
function validateForm(){
  const name=document.getElementById("name").value;
  const user=document.getElementById("username").value;
  const pass=document.getElementById("password").value;
  const msg=document.getElementById("msg");

  if(!name||!user||!pass) msg.textContent="All fields required";
  else msg.textContent="Form submitted successfully";
}
</script>

</body>
</html>
