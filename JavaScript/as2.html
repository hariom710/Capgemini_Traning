<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Asynchronous JavaScrip</h1>
    <p > using setInterval to display time every second </p>
    <h2 id="demo"></h2>
    <script>
        setInterval(myFunction,5000);
        function myFunction() {
            let d = new Date();
            document.getElementById("demo").innerHTML = d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();
        }  
    </script>
</body>
</html>
