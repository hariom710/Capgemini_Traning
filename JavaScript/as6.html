<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>running function in steps</h2>
    <p id="demo"></p>
    <script>
        function myDisplayer(some) {
            document.getElementById("demo").innerHTML =some;
        }
        function step1(){
            return Promise.resolve("step1 ");
        }
        function step2(value){
            return Promise.resolve(value +"step2 ");
        }
        function step3(value){
            return Promise.resolve(value +"step3 ");
        }

        step1()
        .then(function(value){
            return step2(value);
        })
        .then(function(value){
            return step3(value);
        })
        .then(function(value){
            myDisplayer(value);
        })
    </script>
</body>
</html>
