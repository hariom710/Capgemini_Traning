<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict";
        let group={
            title: "Our Group",
            students: ["John", "Pete", "Alice"],
            showList(){
                this.students.forEach(student=>alert(this.title + ": " + student));
            }
        }
        group.showList();
    </script>
</body>
</html>
