<div class="container">
    <h2 class="text-success">Department Listing</h2>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Location</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let dept of deptData">
                <td>{{dept.id}}</td>
                <td>{{dept.name}}</td>
                <td>{{dept.location}}</td>
                <td></td>
                <td>
                    <a [routerLink]="['/edit/',dept.id]">Edit</a>
                    &nbsp;&nbsp;
                    <a [routerLink]="['/find/',dept.id]">Find</a>
                    &nbsp;&nbsp;
                    <a [routerLink]="['/delete/',dept.id]">Delete</a>
                    &nbsp;&nbsp;
                </td>
            </tr>
        </tbody>
    </table>
</div>
