<div class="container">
    <h2 class="text-success">Department Listing</h2>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Location</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let dept of deptdata">
                <td>{{dept.id}}</td>
                <td>{{dept.name}}</td>
                <td>{{dept.location}}</td>
            </tr>
        </tbody>
    </table>

</div>
