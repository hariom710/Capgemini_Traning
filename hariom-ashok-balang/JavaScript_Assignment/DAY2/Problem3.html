<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 3: Mouse Over Event</title>
</head>
<body>

<div id="box" style="width:200px;height:120px;background:gray;"></div>

<script>
let b=document.getElementById("box");
b.addEventListener("mouseover",function(){
b.style.backgroundColor="orange";
});
</script>
    
</body>
</html>
