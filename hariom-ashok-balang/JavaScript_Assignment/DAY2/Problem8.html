<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 8</title>
    <style>
        img {
            width: 400px;
            height: 250px;
            object-fit: cover;
            cursor: pointer;
            transition: 0.3s ease;
        }
    </style>
</head>

<body>

    <img id="img"
        src="https://images.unsplash.com/photo-1688990563744-0de7f7811de5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bW9iaWxlJTIwd2FsbHBhcGVyJTIwNGt8ZW58MHx8MHx8fDA%3D">

    <script>
        let im = document.getElementById("img");

        im.addEventListener("mouseover", function () {
            im.src = "https://images.unsplash.com/photo-1732611360254-89ac36562616?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bW9iaWxlJTIwd2FsbHBhcGVyJTIwNGt8ZW58MHx8MHx8fDA%3D";
        });

        im.addEventListener("mouseout", function () {
            im.src = "https://images.unsplash.com/photo-1688990563744-0de7f7811de5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bW9iaWxlJTIwd2FsbHBhcGVyJTIwNGt8ZW58MHx8MHx8fDA%3D";
        });
    </script>

</body>

</html>
