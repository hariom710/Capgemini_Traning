<body>

<img id="img" src="https://picsum.photos/200/120?random=1"><br>
<button onclick="day()">Show Day</button>
<button onclick="night()">Show Night</button>

<script>
function day(){
document.getElementById("img").src="https://picsum.photos/200/120?random=2";
}
function night(){
document.getElementById("img").src="https://picsum.photos/200/120?random=3";
}
</script>
