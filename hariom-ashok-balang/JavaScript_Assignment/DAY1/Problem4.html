<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 4</title>
</head>
<body>

<button onclick="showEven()">Show Even</button>
<div id="even"></div>

<script>
function showEven(){
let out="";
for(let i=2;i<=20;i+=2) out+=i+" ";
document.getElementById("even").innerText=out;
}
</script>
    
</body>
</html>
