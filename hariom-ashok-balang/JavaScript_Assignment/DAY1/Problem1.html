<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 1</title>
</head>
<body>

<button onclick="showNumbers()">Show Numbers</button>
<ul id="numList"></ul>

<script>
function showNumbers(){
let ul=document.getElementById("numList");
ul.innerHTML="";
for(let i=1;i<=10;i++){
let li=document.createElement("li");
li.textContent=i;
ul.appendChild(li);
}
}
</script>
    
</body>
</html>
