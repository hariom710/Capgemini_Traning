<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem 6: Promise.race</title>
</head>
<body>
<script>
let p1=new Promise(function(res){
    setTimeout(function(){
        res("First finished");
    },1000);
});
let p2=new Promise(function(res){
    setTimeout(function(){
        res("Second finished");
    },2000);
});
Promise.race([p1,p2]).then(function(r){
    console.log(r);
});
</script>
</body>
</html>
