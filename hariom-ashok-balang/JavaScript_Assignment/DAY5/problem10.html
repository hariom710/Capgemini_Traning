<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem 10: Fetch and Chain</title>
</head>
<body>
<script>
fetch("https://jsonplaceholder.typicode.com/users/1").then(function(r){
    return r.json();
}).then(function(user){
    console.log(user.name);
    return fetch("https://jsonplaceholder.typicode.com/posts?userId="+user.id);
}).then(function(r){
    return r.json();
}).then(function(posts){
    console.log(posts.length);
});
</script>
</body>
</html>
