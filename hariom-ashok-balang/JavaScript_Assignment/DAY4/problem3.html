<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem 3: Methods vs Properties</title>
</head>
<body>
<script>
class Rectangle{
    constructor(width,height){
        this.width=width;
        this.height=height;
    }
    area(){
        return this.width*this.height;
    }
    perimeter(){
        return 2*(this.width+this.height);
    }
}
let r=new Rectangle(4,5);
console.log(r.area());
console.log(r.perimeter());
</script>
</body>
</html>
