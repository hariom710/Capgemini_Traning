<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem 1: Basic Class</title>
</head>
<body>
<script>
class Person{
    constructor(name,age){
        this.name=name;
        this.age=age;
    }
    introduce(){
        console.log("Hi I am "+this.name+" and I am "+this.age);
    }
}
let p=new Person("Hariom",21);
p.introduce();
</script>
</body>
</html>
